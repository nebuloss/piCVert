<!--
  piCVert — the green woodpecker (Picus viridis).

  Drawn as a silhouette clinging to a vertical edge, because that is what the
  bird does and what the engine does: it works one upright surface, taps at an
  exact spot, and never wanders off it.

  Built on a 32×32 grid so the same paths serve as a favicon without being
  redrawn. Every shape is a plain path or circle — no gradients, no strokes
  below 1 unit, nothing that turns to mush at 16 px.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="piCVert">
  <title>piCVert</title>

  <!-- The trunk: also the left edge of a sheet of paper. -->
  <rect x="3" y="2" width="3" height="28" rx="1.5" fill="#B9C6BA"/>

  <!-- Tail, braced against the trunk — a woodpecker's third foot. -->
  <path d="M9 21 L6 29 L11.5 26.5 Z" fill="#4C6B3C"/>

  <!-- Body. -->
  <path d="M9 12
           C9 8.5 11.5 6 15 6
           C18.8 6 21.5 8.8 21.5 12.6
           L21.5 18
           C21.5 22.4 18.4 25.5 14.6 25.5
           C11.4 25.5 9 23 9 19.6 Z"
        fill="#5E9E42"/>

  <!-- Pale throat and belly. -->
  <path d="M12 13.5
           C14.6 13.5 16.4 15.4 16.4 18.2
           C16.4 21.4 14.8 23.6 12.4 24.2
           C10.4 23.4 9 21.7 9 19.6 Z"
        fill="#CFE0A8"/>

  <!-- Yellow-green rump, the field mark you see when it flies away. -->
  <path d="M9 18.5 C10.6 19.8 11 22 10.4 24.6 C9.4 23.4 9 21.8 9 19.8 Z"
        fill="#C9D84A"/>

  <!-- The red crown. -->
  <path d="M10.2 10.2
           C10.6 6.6 13 4.4 16 4.4
           C18.6 4.4 20.6 6 21.3 8.6
           C18.6 7.2 13.4 7.6 10.2 10.2 Z"
        fill="#D3352B"/>

  <!-- Black mask through the eye. -->
  <path d="M18.6 9.6 C20.4 9.6 21.8 10.3 22.6 11.4 L20.4 13 C19.4 11.6 18.6 10.6 18.6 9.6 Z"
        fill="#23291F"/>

  <!-- Beak: long, straight, chisel-tipped, aimed at the trunk it is not on —
       the bird is turned to face the page. -->
  <path d="M21.4 10.6 L30 12.1 L21.4 13.8 Z" fill="#3F4A38"/>

  <circle cx="19.1" cy="10.1" r="1.25" fill="#FFFFFF"/>
  <circle cx="19.1" cy="10.1" r="0.6" fill="#23291F"/>

  <!-- Feet gripping the trunk. Short and overlapping the bark, because drawn
       long they read as two floating bars rather than as a grip. -->
  <path d="M10 14.6 L5.6 15.4 M10 19 L5.6 19.8"
        stroke="#3F4A38" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <circle cx="6.2" cy="15.4" r="1.1" fill="#3F4A38"/>
  <circle cx="6.2" cy="19.8" r="1.1" fill="#3F4A38"/>
</svg>
