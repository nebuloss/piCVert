<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210" height="297" role="img" aria-label="Material You — two columns, tonal cards, coloured header band">
  <!--
    Schematic of the layout, not a screenshot: it has to stay true when the
    wording of a CV changes, and it must carry no personal data — the engine is
    published. Same proportions as the A4 page, same palette as theme.css, so
    the thumbnail reads as the thing it produces.
  -->
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D3E3FD"/>
      <stop offset="60%" stop-color="#E7EFFC"/>
      <stop offset="100%" stop-color="#CFE7DC"/>
    </linearGradient>
    <clipPath id="page"><rect width="210" height="297" rx="4"/></clipPath>
  </defs>

  <g clip-path="url(#page)">
    <rect width="210" height="297" fill="#F5F8FE"/>

    <!-- header -->
    <g transform="translate(8 8)">
      <rect width="194" height="52" rx="9" fill="url(#band)"/>
      <circle cx="30" cy="26" r="17" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2"/>
      <circle cx="30" cy="26" r="15" fill="#C9D7EE"/>
      <rect x="56" y="12" width="76" height="8" rx="4" fill="#0A1B33" opacity=".82"/>
      <rect x="56" y="25" width="46" height="7" rx="3.5" fill="#0B57D0"/>
      <rect x="56" y="37" width="96" height="4" rx="2" fill="#04264E" opacity=".45"/>
    </g>

    <!-- left column -->
    <g transform="translate(8 68)">
      <rect width="72" height="54" rx="7" fill="#FFFFFF" stroke="#D5DBE6"/>
      <circle cx="9" cy="10" r="2.6" fill="#0B57D0"/>
      <rect x="15" y="7.5" width="30" height="5" rx="2.5" fill="#0B57D0"/>
      <g fill="#1A1C1F" opacity=".38">
        <rect x="9" y="20" width="54" height="3.6" rx="1.8"/>
        <rect x="9" y="28" width="48" height="3.6" rx="1.8"/>
        <rect x="9" y="36" width="52" height="3.6" rx="1.8"/>
        <rect x="9" y="44" width="40" height="3.6" rx="1.8"/>
      </g>

      <rect y="60" width="72" height="62" rx="7" fill="#EEF2FA"/>
      <circle cx="9" cy="70" r="2.6" fill="#0B57D0"/>
      <rect x="15" y="67.5" width="34" height="5" rx="2.5" fill="#0B57D0"/>
      <g>
        <rect x="9" y="80" width="24" height="8" rx="4" fill="#D3E3FD"/>
        <rect x="36" y="80" width="18" height="8" rx="4" fill="#DBE2F0"/>
        <rect x="9" y="91" width="20" height="8" rx="4" fill="#C7ECD8"/>
        <rect x="32" y="91" width="26" height="8" rx="4" fill="#DBE2F0"/>
        <rect x="9" y="102" width="30" height="8" rx="4" fill="#D3E3FD"/>
      </g>

      <rect y="128" width="72" height="46" rx="7" fill="#FFFFFF" stroke="#D5DBE6"/>
      <circle cx="9" cy="138" r="2.6" fill="#0B57D0"/>
      <rect x="15" y="135.5" width="28" height="5" rx="2.5" fill="#0B57D0"/>
      <g>
        <rect x="9" y="148" width="54" height="4" rx="2" fill="#EEF2FA"/>
        <rect x="9" y="148" width="44" height="4" rx="2" fill="#0B57D0"/>
        <rect x="9" y="158" width="54" height="4" rx="2" fill="#EEF2FA"/>
        <rect x="9" y="158" width="30" height="4" rx="2" fill="#0B57D0"/>
      </g>
    </g>

    <!-- right column -->
    <g transform="translate(88 68)">
      <rect width="114" height="42" rx="7" fill="#FFFFFF" stroke="#D5DBE6"/>
      <circle cx="9" cy="10" r="2.6" fill="#0B57D0"/>
      <rect x="15" y="7.5" width="26" height="5" rx="2.5" fill="#0B57D0"/>
      <g fill="#474B52" opacity=".42">
        <rect x="9" y="19" width="96" height="3.4" rx="1.7"/>
        <rect x="9" y="26" width="90" height="3.4" rx="1.7"/>
        <rect x="9" y="33" width="66" height="3.4" rx="1.7"/>
      </g>

      <rect y="48" width="114" height="98" rx="7" fill="#FFFFFF" stroke="#D5DBE6"/>
      <circle cx="9" cy="58" r="2.6" fill="#0B57D0"/>
      <rect x="15" y="55.5" width="32" height="5" rx="2.5" fill="#0B57D0"/>
      <g>
        <!-- timeline entries: rail, dot, title, period pill, bullets -->
        <circle cx="10" cy="72" r="2.4" fill="#0B57D0"/>
        <rect x="9.2" y="76" width="1.6" height="26" fill="#D5DBE6"/>
        <rect x="17" y="69" width="46" height="5" rx="2.5" fill="#1A1C1F" opacity=".8"/>
        <rect x="82" y="69" width="23" height="6" rx="3" fill="#D3E3FD"/>
        <rect x="17" y="78" width="36" height="4" rx="2" fill="#0B57D0"/>
        <g fill="#474B52" opacity=".38">
          <rect x="20" y="87" width="82" height="3" rx="1.5"/>
          <rect x="20" y="94" width="72" height="3" rx="1.5"/>
        </g>

        <circle cx="10" cy="112" r="2.4" fill="#0B57D0"/>
        <rect x="17" y="109" width="40" height="5" rx="2.5" fill="#1A1C1F" opacity=".8"/>
        <rect x="82" y="109" width="23" height="6" rx="3" fill="#D3E3FD"/>
        <rect x="17" y="118" width="32" height="4" rx="2" fill="#0B57D0"/>
        <g fill="#474B52" opacity=".38">
          <rect x="20" y="127" width="78" height="3" rx="1.5"/>
          <rect x="20" y="134" width="60" height="3" rx="1.5"/>
        </g>
      </g>

      <rect y="152" width="114" height="52" rx="7" fill="#FFFFFF" stroke="#D5DBE6"/>
      <circle cx="9" cy="162" r="2.6" fill="#0B57D0"/>
      <rect x="15" y="159.5" width="30" height="5" rx="2.5" fill="#0B57D0"/>
      <g fill="#474B52" opacity=".38">
        <rect x="20" y="173" width="84" height="3" rx="1.5"/>
        <rect x="20" y="181" width="76" height="3" rx="1.5"/>
        <rect x="20" y="189" width="88" height="3" rx="1.5"/>
      </g>
      <g fill="#0B57D0">
        <circle cx="14" cy="174.5" r="1.5"/>
        <circle cx="14" cy="182.5" r="1.5"/>
        <circle cx="14" cy="190.5" r="1.5"/>
      </g>
    </g>
  </g>

  <rect x=".5" y=".5" width="209" height="296" rx="4" fill="none" stroke="#D5DBE6"/>
</svg>
