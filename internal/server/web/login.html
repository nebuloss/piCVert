<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>piCVert — sign in</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  /* Inline, and the only page here that is. Everything else is loaded from
     /assets; this page is shown to somebody who has proved nothing, and
     fetching the interface for them would be drawing part of it first. */
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #faf7f0; color: #1b1b1f;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  form {
    background: #fff; border: 1px solid #e4e1da; border-radius: 14px;
    padding: 28px 30px; width: 320px;
  }
  h1 { font-size: 17px; margin: 0 0 4px; }
  p { margin: 0 0 18px; color: #5d5d66; font-size: 13px; }
  input {
    width: 100%; font: inherit; padding: 9px 11px; border-radius: 8px;
    border: 1px solid #e4e1da; margin-bottom: 12px;
  }
  input:focus { outline: 2px solid #8a5a12; outline-offset: -1px; }
  button {
    width: 100%; font: inherit; padding: 9px; border-radius: 999px;
    border: 1px solid #8a5a12; background: #8a5a12; color: #fff; cursor: pointer;
  }
  button:hover { opacity: .9; }
  .problem { color: #a3401f; font-weight: 600; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>piCVert administration</h1>
  <p>{{if .Problem}}<span class="problem">{{.Problem}}</span>{{else}}This port manages every CV on the service.{{end}}</p>
  <input type="password" name="password" placeholder="Password" autofocus
         autocomplete="current-password" required>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
