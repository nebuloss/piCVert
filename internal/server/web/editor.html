<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editing — piCVert</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{asset "editor.css"}}">
</head>
<body data-base="{{.Base}}" data-slug="{{.Slug}}" data-token="{{.Token}}">

<header id="bar">
  <strong>piCVert</strong>
  <span id="state" class="state">loading…</span>
  <span class="spacer"></span>
  <select id="lang" aria-label="Language" hidden></select>
  <button id="add-lang" title="Add a language">+ lang</button>
  <button id="history-open">History</button>
  <a class="button" data-kind="pdf" href="{{.Base}}/cv.pdf" target="_blank" rel="noopener">PDF</a>
  <a class="button" data-kind="page" href="{{.Base}}/" target="_blank" rel="noopener">View</a>
</header>

<!-- On a phone the two panes become one at a time, chosen here.
     Hidden on a wide screen, where both are visible together and a switch
     would be a control that does nothing. -->
<nav id="panes" role="tablist" aria-label="View">
  <button id="pane-edit" role="tab" aria-selected="true" aria-controls="form">Edit</button>
  <button id="pane-preview" role="tab" aria-selected="false" aria-controls="preview">Preview</button>
</nav>

<main>
  <section id="form" aria-label="The CV's fields"></section>
  <section id="preview">
    <div id="fit" class="fit"></div>
    <div id="stage"><div id="scaler"><iframe id="page" title="Preview"></iframe></div></div>
  </section>
</main>

<!-- Shown when somebody else is editing, and when this window loses the right
     to. Its own dialog rather than the history one: they can both be relevant,
     and a dialog that means two things is a dialog that shows the wrong one. -->
<dialog id="busy">
  <h2>This CV is open somewhere else</h2>
  <div id="busy-body"></div>
</dialog>

<dialog id="history">
  <h2>History</h2>
  <div id="history-body"></div>
  <form method="dialog"><button>Close</button></form>
</dialog>

<script type="module" src="{{asset "editor.js"}}"></script>
</body>
</html>
