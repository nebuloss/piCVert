<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>piCVert — administration</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="{{asset "admin.css"}}">
</head>
<body data-public-url="{{.PublicURL}}" data-public-port="{{.PublicPort}}">

<header class="topbar">
  <!-- The amber bird, not the green one: the two surfaces are usually open
       side by side and only this one deletes CVs. -->
  <img class="mark" src="/favicon.svg" alt="" width="26" height="26">
  <div class="title">
    <strong>piCVert</strong>
    <span class="where">administration</span>
  </div>
  <span class="spacer"></span>
  <span class="muted" id="policy"></span>
  <a class="signout" href="/logout">Sign out</a>
</header>

<p class="caution">
  <b>This port has no access control by design.</b>
  It is protected by not being proxied — never expose it.
</p>

<main>
  <section id="metrics" aria-label="What the service is doing"></section>

  <!-- Two views, never stacked.
       The CVs and the trash are not looked at in the same motion: one is the
       current inventory, the other a safety net opened when something has
       gone missing. Stacking them padded the inventory with what nobody was
       looking for. -->
  <nav class="views" role="tablist" aria-label="Views">
    <button class="view-tab" id="tab-cvs" role="tab" aria-selected="true"
            aria-controls="view-cvs">
      CVs <span class="badge" id="badge-cvs">—</span>
    </button>
    <button class="view-tab" id="tab-trash" role="tab" aria-selected="false"
            aria-controls="view-trash">
      Set aside <span class="badge" id="badge-trash">—</span>
    </button>
  </nav>

  <section id="view-cvs" role="tabpanel" aria-labelledby="tab-cvs">
    <div class="bar">
      <input type="search" id="q" placeholder="Search by name or identifier"
             aria-label="Search" autocomplete="off" spellcheck="false">
      <span class="muted" id="count"></span>
      <button id="prev" title="Previous page" aria-label="Previous page">‹</button>
      <button id="next" title="Next page" aria-label="Next page">›</button>
      <button class="primary" id="new">+ New CV</button>
    </div>

    <!-- Folded away until it is wanted: the inventory is what people come to
         see, and a form above it pushed the list off the screen. -->
    <section class="panel" id="create" hidden aria-label="Create a CV"></section>

    <div id="list"></div>
  </section>

  <section id="view-trash" role="tabpanel" aria-labelledby="tab-trash" hidden>
    <p class="lede">
      Deleted CVs wait here before being erased for good, so a mistake can be
      undone. Each shows how long is left.
    </p>
    <div id="trash"></div>
  </section>
</main>

<script type="module" src="{{asset "admin.js"}}"></script>
</body>
</html>
