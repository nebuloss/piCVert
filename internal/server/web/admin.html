<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>piCVert — administration</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/admin/admin.css">
</head>
<body data-public-url="{{.PublicURL}}">

<header>
  <strong>piCVert</strong>
  <span class="warn">administration — no access control, never proxy this port</span>
  <span class="spacer"></span>
  <span class="muted" id="policy"></span>
</header>

<main>
  <section id="create" aria-label="Create a CV"></section>

  <div class="bar">
    <input type="search" id="q" placeholder="Search a CV" aria-label="Search">
    <span class="spacer"></span>
    <span class="muted" id="count"></span>
    <button id="prev" title="Previous page">‹</button>
    <button id="next" title="Next page">›</button>
  </div>
  <div id="list"></div>

  <h2>Set aside</h2>
  <p class="muted">
    Deleted CVs wait here before being erased for good, so a mistake can be undone.
  </p>
  <div id="trash"></div>
</main>

<script type="module" src="/assets/admin/admin.js"></script>
</body>
</html>
