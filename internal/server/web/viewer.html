<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Name}} — CV</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/viewer/viewer.css">
</head>
<body data-base="{{.Base}}" data-lang="{{.Lang}}">

<header id="chrome">
  <h1>{{.Name}}</h1>
  <select id="lang" hidden aria-label="Language"></select>
  <a class="button" id="pdf" href="{{.Base}}/cv.pdf">PDF</a>
  {{if .CanEdit}}<a class="button primary" href="{{.Base}}/edit/">Edit</a>{{end}}
</header>

<div id="stage"><div id="fit"><iframe id="cv" title="{{.Name}}"></iframe></div></div>

<!-- The languages travel as JSON in a script tag rather than as attributes:
     one value, parsed once, and nothing to escape by hand. -->
<script type="application/json" id="languages">{{.Languages}}</script>
<script type="module" src="/assets/viewer/viewer.js"></script>
</body>
</html>
