# piCVert, in a container.
#
# INSTALLED ONLY WHEN THE STRICT UNIT WILL NOT START, and only then — see
# deploy/install.sh, which tries the unit as shipped first and drops this in if
# systemd refuses it.
#
# The main unit asks the kernel for a private /dev, a read-only /proc/sys and a
# few other mount-namespace tricks. In an UNPRIVILEGED container the kernel
# refuses them, and systemd fails the service with status 226/NAMESPACE — which
# names nothing a person can act on and looks exactly like a broken binary.
#
# What is given up here is defence in depth against a compromised process, and
# what is kept is everything that does not need to mount: no new privileges, a
# system call filter, no writable-and-executable memory, and write access to one
# directory. The container is itself the boundary those options were duplicating.

[Service]
# Mount-namespace options the kernel will not grant to an unprivileged
# container. Cleared rather than softened: a half-applied namespace is a
# confusing failure, where none at all is a documented one.
PrivateDevices=no
ProtectKernelTunables=no
ProtectKernelModules=no
ProtectControlGroups=no
ProtectClock=no

# ProtectSystem and ProtectHome DO work in a container, and they are the two
# that matter most here — they are what keeps the service from writing anywhere
# but its own data directory. Left exactly as the main unit set them.
