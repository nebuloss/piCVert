# piCVert behind nginx.
#
# THE ADMIN PORT IS NOT IN THIS FILE, and that is the whole arrangement. It has
# no access control by design; what keeps it safe is that nothing outside can
# reach it. Reach it over SSH instead:
#
#     ssh -L 3001:127.0.0.1:3001 your-host
#
# and open http://127.0.0.1:3001 on your own machine.

server {
    listen 80;
    listen [::]:80;
    server_name cv.example.com;

    # The only thing on port 80 is the redirect and the ACME challenge.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cv.example.com;

    ssl_certificate     /etc/letsencrypt/live/cv.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cv.example.com/privkey.pem;

    # A CV is a few hundred kilobytes; a portrait is the only thing with any
    # size, and the service caps it at 4 MB itself. This is the outer bound.
    client_max_body_size 8m;

    # The engine sets its own Content-Security-Policy, and it differs per kind
    # of page: the CV itself runs no script at all, the editor runs ours. A
    # policy added here would apply one of them to all of them, and the strict
    # one would break the editor while the loose one would weaken the CV.
    # So: nothing is added, and nothing is overridden.

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The failure throttle counts by address, and behind a proxy every
        # request arrives from the proxy. Without this, ten thousand attempts
        # from ten thousand machines look like one busy client — and
        # PICVERT_TRUST_PROXY=1 must be set for the service to believe it.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # And without this the service thinks it is serving plain HTTP, and
        # withholds the headers that only mean anything over TLS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # A PDF of a long CV takes a moment to draw. The default 60s is ample;
        # stated so that raising it later is an edit rather than a discovery.
        proxy_read_timeout 60s;
    }

    # The engine's own robots.txt keeps crawlers off /e/ — where the private
    # links live — and leaves published CVs indexable. It is served by the
    # service so that it cannot fall out of step with the routes it names.

    access_log /var/log/nginx/picvert.access.log;
    error_log  /var/log/nginx/picvert.error.log;
}
